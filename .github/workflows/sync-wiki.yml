name: Sync GitHub Wiki

on:
  push:
    branches:
      - main
    paths:
      - '.docs/wiki/**'
      - '.github/workflows/sync-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-github-wiki
  cancel-in-progress: true

jobs:
  sync-wiki:
    name: Publish .docs/wiki to GitHub Wiki
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Clone wiki repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" \
            "$RUNNER_TEMP/wiki"

      - name: Mirror player wiki files
        run: |
          set -euo pipefail
          rsync -av --delete --exclude='.git/' .docs/wiki/ "$RUNNER_TEMP/wiki/"

      - name: Convert repository links to GitHub Wiki page links
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          wiki_dir = Path(os.environ["RUNNER_TEMP"]) / "wiki"
          local_md_link = re.compile(
              r'\((?:\./)?([A-Za-z0-9_-]+)\.md(#[^)]+)?\)'
          )

          for path in wiki_dir.rglob("*.md"):
              original = path.read_text(encoding="utf-8")
              converted = local_md_link.sub(
                  lambda match: f"({match.group(1)}{match.group(2) or ''})",
                  original,
              )
              if converted != original:
                  path.write_text(converted, encoding="utf-8")
                  print(f"Converted local wiki links in {path.name}")
          PY

      - name: Commit and publish changes
        working-directory: ${{ runner.temp }}/wiki
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Wiki already matches .docs/wiki; nothing to publish."
            exit 0
          fi

          git commit -m "Sync wiki from ${GITHUB_SHA::7}"
          git push
